name: Create DfE Website

on:
  repository_dispatch:
    types: [create-dfe-website]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Main branch
      uses: actions/checkout@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main

    - name: Install Power Platform Tools
      uses: microsoft/powerplatform-actions/actions-install@v1

    - name: Authentication Check
      uses: microsoft/powerplatform-actions/who-am-i@v1
      with:
        environment-url:   ${{ github.event.client_payload.environment_url }}
        app-id:            ${{ github.event.client_payload.client_id }}
        client-secret:     ${{ github.event.client_payload.client_secret }}
        tenant-id:         ${{ secrets.TENANT_ID }}

    - name: Inject DfE WebFiles connection string
      shell: pwsh
      run: |
        $folder = "${{ secrets.DFE_WEBSITE_FOLDER }}"
        $siteSettingYamlPath = "./$folder/sitesetting.yml"
        if (-Not (Test-Path $siteSettingYamlPath)) {
          Write-Error "File not found: $siteSettingYamlPath"
          exit 1
        }
        $secretValue = "${{ secrets.DFE_WEBFILES_CONNSTR }}"
        $content = Get-Content $siteSettingYamlPath
        for ($i = 0; $i -lt $content.Length; $i++) {
          if ($content[$i] -match '^[ \t]*- adx_name: WebFiles/CloudStorageAccount\s*$') {
            for ($j = $i + 1; $j -lt $content.Length; $j++) {
              if ($content[$j] -match '^[ \t]*adx_value: ') {
                $content[$j] = "  adx_value: $secretValue"
                break
              }
              if ($content[$j] -match '^[^ \t]') { break }
            }
          }
        }
        Set-Content -Path $siteSettingYamlPath -Value $content

    - name: Upload DfE Site to Target Environment
      uses: microsoft/powerplatform-actions/upload-paportal@v1
      with:
        environment-url:   ${{ github.event.client_payload.environment_url }}
        app-id:            ${{ github.event.client_payload.client_id }}
        client-secret:     ${{ github.event.client_payload.client_secret }}
        tenant-id:         ${{ secrets.TENANT_ID }}
        upload-path:       "./${{ secrets.DFE_WEBSITE_FOLDER }}"
        model-version:     enhanced
