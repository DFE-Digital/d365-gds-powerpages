name: Download GOVUK Portal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check Permissions
      shell: pwsh
      run: |
        $authorizedUsers = "${{ secrets.AUTHORIZED_USERS }}"
        $currentUser = "${{ github.actor }}"
        if ($authorizedUsers -notcontains $currentUser) {
          Write-Output "Error: You do not have permission to run this workflow."
          exit 1
        }
    
    - name: Checkout Repository
      uses: actions/checkout@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Install Power Platform Tools
      uses: microsoft/powerplatform-actions/actions-install@v1

    - name: Authentication Check
      uses: microsoft/powerplatform-actions/who-am-i@v1
      with:
        environment-url: ${{ secrets.POWER_PLATFORM_URL }}
        app-id: ${{ secrets.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        tenant-id: ${{ secrets.TENANT_ID }}
        
    - name: Download GOVUK Portal
      uses: microsoft/powerplatform-actions/download-paportal@v1
      with:
        environment-url: ${{ secrets.POWER_PLATFORM_URL }}
        app-id: ${{ secrets.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        tenant-id: ${{ secrets.TENANT_ID }}
        download-path: .
        website-id: ${{ secrets.GOVUK_WEBSITE_ID }}
        overwrite: true

    - name: Remove central-* Files and Folders
      shell: pwsh
      run: |
        Get-ChildItem -Path . -Filter "central-*" -Recurse | ForEach-Object {
          if ($_.PSIsContainer) {
            Remove-Item -Recurse -Force $_.FullName
          } else {
            Remove-Item -Force $_.FullName
          }
        }

    - name: Install PowerShell YAML Module
      shell: pwsh
      run: Install-Module -Name powershell-yaml -Force -Scope CurrentUser

    - name: Remove Central/* Records from Manifest
      shell: pwsh
      run: |
        # Load YAML module
        Import-Module powershell-yaml

        # Path to YAML file
        $yamlPath = "./govuk-central-portal/.portalconfig/govuk-central-patterns-components.crm4.dynamics.com-manifest.yml"

        # Load YAML content
        $yamlContent = Get-Content -Path $yamlPath -Raw | ConvertFrom-Yaml

        # Create a list of section names to iterate over safely
        $sections = $yamlContent.Keys | ForEach-Object { $_ }

        # Process each section and filter records within
        foreach ($section in $sections) {
            $yamlContent[$section] = $yamlContent[$section] | Where-Object {
                $_.DisplayName -notlike 'Central/*'
            }
        }

        # Save the updated content back to the YAML file
        $yamlContent | ConvertTo-Yaml | Set-Content -Path $yamlPath


    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Commit and Push Portal Files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Stage and commit all changes
        git add .
        git commit -m "Added GOVUK portal download for build ${GITHUB_RUN_NUMBER}" || echo "No changes to commit"
        
        # Push changes to the branch from which the workflow was triggered
        git push origin HEAD
        
