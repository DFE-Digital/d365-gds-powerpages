name: Download GOVUK Portal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Install Power Platform CLI
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://aka.ms/PowerAppsCLI -OutFile PowerAppsCLI.msi
        Start-Process msiexec.exe -ArgumentList '/i PowerAppsCLI.msi /quiet /norestart' -NoNewWindow -Wait

    - name: Locate Power Platform CLI and Add to PATH
      shell: pwsh
      run: |
        # Search for 'pac.exe' in common installation locations
        $pacPath = Get-ChildItem -Path 'C:\' -Recurse -Filter 'pac.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
        
        if ($null -eq $pacPath) {
          throw "Power Platform CLI 'pac.exe' not found on this system."
        }
        
        echo "CLI found at: $pacPath"
        $env:PATH += ";$pacPath"

    - name: Confirm CLI Installation and Add to PATH
      shell: pwsh
      run: |
        # Confirm that pac is available in the path
        Get-Command pac || throw "Power Platform CLI 'pac' not found in PATH."

    - name: Authenticate with Service Principal
      shell: pwsh
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        TENANT_ID: ${{ secrets.TENANT_ID }}
      run: |
        pac auth create --url ${{ secrets.ENVIRONMENT_URL }} --client-id $CLIENT_ID --client-secret $CLIENT_SECRET --tenant $TENANT_ID
