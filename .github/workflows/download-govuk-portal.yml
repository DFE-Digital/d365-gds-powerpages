name: Power Platform Portal Actions

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Trigger workflow (no other inputs needed)"
        default: "yes"
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check Permissions
      run: |
        if [[ ",${{ secrets.AUTHORIZED_USERS }}," != *",${{ github.actor }},"* ]]; then
          echo "Error: You do not have permission to run this workflow."
          exit 1
        fi
    
    - name: Checkout Repository
      uses: actions/checkout@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Install Power Platform Tools
      uses: microsoft/powerplatform-actions/actions-install@v1

    - name: Authentication Check
      uses: microsoft/powerplatform-actions/who-am-i@v1
      with:
        environment-url: ${{ secrets.POWER_PLATFORM_URL }}
        app-id: ${{ secrets.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        tenant-id: ${{ secrets.TENANT_ID }}
        
    - name: Download GOVUK Portal
      uses: microsoft/powerplatform-actions/download-paportal@v1
      with:
        environment-url: ${{ secrets.POWER_PLATFORM_URL }}
        app-id: ${{ secrets.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        tenant-id: ${{ secrets.TENANT_ID }}
        download-path: .
        website-id: ${{ secrets.GOVUK_WEBSITE_ID }}
        overwrite: true

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Commit and Push Portal Files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Stage and commit all changes
        git add .
        git commit -m "Added GOVUK portal download for build ${GITHUB_RUN_NUMBER}" || echo "No changes to commit"
        
        # Push changes to the branch from which the workflow was triggered
        git push origin HEAD
        
