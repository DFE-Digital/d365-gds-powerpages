name: Download GOVUK Portal

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Trigger workflow (no other inputs needed)"
        default: "yes"
        required: false
        type: string

jobs:
  portal-actions:
    runs-on: ubuntu-latest

    steps:
    - name: Set up .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Install Power Platform CLI
      run: |
        dotnet tool install -g microsoft.powerplatform.cli
        export PATH="$PATH:~/.dotnet/tools"

    - name: Authenticate with Power Platform
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        TENANT_ID: ${{ secrets.TENANT_ID }}
      run: |
        TOKEN=$(curl -X POST -H "Content-Type: application/x-www-form-urlencoded" \
          -d "client_id=$CLIENT_ID&client_secret=$CLIENT_SECRET&scope=${{ secrets.POWER_PLATFORM_URL }}/.default&grant_type=client_credentials" \
          "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" | jq -r .access_token)
        echo "TOKEN=$TOKEN" >> $GITHUB_ENV

    - name: Download Portal Files
      env:
        TOKEN: ${{ env.TOKEN }}
        POWER_PLATFORM_URL: ${{ secrets.POWER_PLATFORM_URL }}
      run: |
        pac paportal download --environment ${{ secrets.POWER_PLATFORM_URL }} \
                              --webSiteId ${{ secrets.GOVUK_WEBSITE_ID }} \
                              --path /
