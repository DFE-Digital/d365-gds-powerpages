<script>
//DfECookies.RunCookieScript();
DfEPortal.Cookies.CheckCookieExists("accept-analytics-cookie")
    .then((result) => {
      DfEPortal.Cookies.GetCookieValue("accept-analytics-cookie")
      .then((cookieVal) => {
        var analyticsCookie = cookieVal;
 
        // Check if the analytics cookie has been accepted and is not expired
        var isAnalyticsAccepted = analyticsCookie === "accepted";
 
        // Check if the analytics cookie has been rejected and is not expired
        var isAnalyticsRejected = analyticsCookie === "rejected";
 
        // Get the cookies banner element
        var cookiesBanner = document.querySelector('.govuk-cookie-banner');
 
        // Hide or show the cookies banner based on the conditions
        if (isAnalyticsAccepted == true && isAnalyticsRejected == false) {
        // Hide cookies banner
        cookiesBanner.classList.add('govuk-visually-hidden');
        } else if (isAnalyticsAccepted == false && isAnalyticsRejected == true) {
        // Hide cookies banner
        cookiesBanner.classList.add('govuk-visually-hidden');
        } else {
        // If not accepted or rejected, show the cookies banner
        cookiesBanner.classList.remove('govuk-visually-hidden');
        }
      })
      .catch(error => {
        var cookiesBanner = document.querySelector('.govuk-cookie-banner');
        cookiesBanner.classList.remove('govuk-visually-hidden');
      })
    })
    .catch(error => {
      console.log(error);
    })
    </script>
