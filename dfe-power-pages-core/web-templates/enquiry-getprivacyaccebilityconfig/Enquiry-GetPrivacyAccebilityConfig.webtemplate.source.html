{% fetchxml privacyAccessbility_query %}
  <fetch>
    <entity name="dfe_enquiryprivacyconfig">
    <attribute name="dfe_enquiryprivacyconfigid" />
    <attribute name="dfe_name" />
    <attribute name="dfe_portalpage" />
    <attribute name="dfe_gdslisttype" />
    <attribute name="dfe_gdstype" />
    <attribute name="dfe_text" />
    <attribute name="dfe_subheading" />
    <attribute name="dfe_order" />
    <order attribute="dfe_order" descending="false" />
    <order attribute="dfe_name" descending="false" />
    <filter type="and">
    <condition attribute="dfe_portalpage" operator="eq" uitype="dfe_enquiryotherpages" value="{{portalPage}}" />
    <condition attribute="statecode" operator="eq" value="0" />
    </filter>
    </entity>
  </fetch>
{% endfetchxml %}
{% assign privacyAccessbilityQuery_Result = privacyAccessbility_query.results.entities %}
