{% fetchxml gdsTable_query %}
  <fetch>
      <entity name="dfe_enquirygdstable">
        <attribute name="dfe_enquirygdstableid" />
        <attribute name="dfe_name" />
        <attribute name="dfe_tblcolumnpurpose" />
        <attribute name="dfe_tblcolumnname" />
        <attribute name="dfe_tblcolumnexpires" />                      
        <attribute name="dfe_radiobuttonlabel" />
        <attribute name="dfe_listitem" />
        <attribute name="dfe_gdstype" />                      
        <attribute name="dfe_enquirycookieconfig" />
        <attribute name="dfe_enquiryprivacyconfig" />
        <attribute name="dfe_order" />
        <order attribute="dfe_order" descending="false" />
        <order attribute="dfe_name" descending="false" />
        <filter type="and">
          <condition attribute="statecode" operator="eq" value="0" />
          {% if pageType == "privacyAccessibility" %}
            <condition attribute="dfe_enquiryprivacyconfig" operator="eq" uitype="dfe_enquiryprivacyconfig" value="{{pageConfigId}}" />
          {% else %}
            <condition attribute="dfe_enquirycookieconfig" operator="eq" uitype="dfe_enquirycookiespageconfig" value="{{pageConfigId}}" />
         {% endif %}
        </filter>
      </entity>
    </fetch>
  {% endfetchxml %}
{% assign gdsTableQuery_Result = gdsTable_query.results.entities %}
