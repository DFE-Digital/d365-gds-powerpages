{% assign lastSuccessfulLoginSetting = settings['Analytics/LastSuccessfulLoginTelemetry/Setting'] %}
<script>
  var loginCacheKey = "lastLoginKey";
 var userObject = "{{user.id}}";
 var retLastFull = "{{lastSuccessfulLoginSetting}}";
 debugger;
   if(userObject && "{{lastSuccessfulLoginSetting}}" === "true")
   {  
    debugger;
    if (!sessionStorage.getItem(loginCacheKey)) {
      addEventListener("DOMContentLoaded", (event) => {        
        const now = new Date();
        sessionStorage.setItem(loginCacheKey, now);
        const dataObject={
          "adx_identity_lastsuccessfullogin": now
        };
        DfEPortal.WebApi.Update("{{user.id}}", "contacts", dataObject)
        .then(() => {
         
        })
        .catch((error) => {
          console.log(error);
          sessionStorage.removeItem(loginCacheKey);
          })
      });      
    }
   }
   else
   {    
    sessionStorage.removeItem(loginCacheKey);
   }  
</script>
