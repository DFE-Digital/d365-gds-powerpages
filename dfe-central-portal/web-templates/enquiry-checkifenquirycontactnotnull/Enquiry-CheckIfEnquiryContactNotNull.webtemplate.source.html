{% assign currentDatePlusOne = now | date_add_days: 1 | date: "yyyy-MM-dd HH:mm:ss" %}
{% fetchxml checkIfEnquiryContactNotNull %}
<fetch version="1.0" output-format="xml-platform" mapping="logical" distinct="false" returntotalrecordcount="true">
  <entity name="dfe_enquiry">
    <attribute name="dfe_enquiryid" />
    <attribute name="dfe_name" />
    <attribute name="dfe_enquirycontact" />
    <order attribute="dfe_name" descending="false" />
    <filter type="and">
      <condition attribute="dfe_enquirycontact" operator="not-null" />
	  <condition attribute="createdon" operator="le" value="{{ currentDatePlusOne }}" />
      <condition attribute='dfe_enquiryid' operator='eq'  uitype='dfe_enquiry' value='{{enqId}}' />
    </filter>
  </entity>
</fetch>
{% endfetchxml %}
{% assign checkIfEnquiryContactNotNull_result = checkIfEnquiryContactNotNull.results.entities %}
