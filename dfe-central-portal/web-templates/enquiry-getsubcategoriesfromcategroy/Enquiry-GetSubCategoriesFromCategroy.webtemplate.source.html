{% assign currentDatePlusOne = now | date_add_days: 1 | date: "yyyy-MM-dd HH:mm:ss" %}
{% assign catId = request.params['catId'] %}
{% fetchxml GetSubCategoriesFromCategory %}
<fetch version="1.0" output-format="xml-platform" mapping="logical" distinct="false" returntotalrecordcount="true">
  <entity name="dfe_subcategory">
    <attribute name="dfe_subcategoryid" />
    <attribute name="dfe_name" />
    <attribute name="createdon" />
    <order attribute="dfe_name" descending="false" />
    <filter type="and">
      <condition attribute='dfe_category' operator='eq'  uitype='dfe_category' value='{{catId}}' />
	     <condition attribute="createdon" operator="le" value="{{ currentDatePlusOne }}" />
      <condition attribute="statecode" operator="eq" value="0" />
    </filter>
  </entity>
</fetch>
{% endfetchxml %}
{
    "totalcount": {{ GetSubCategoriesFromCategory.results.total_record_count }}
}
