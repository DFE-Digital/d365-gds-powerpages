{% fetchxml portalPageconfig_query %}
   <fetch >
    <entity name="dfe_enquiryportalpageconfig">
    <attribute name="dfe_enquiryportalpageconfigid" />
    <attribute name="dfe_name" />
    <attribute name="dfe_title" />
    <attribute name="dfe_enablerecaptcha" />
    <attribute name="dfe_caption" />
    <order attribute="dfe_name" descending="false" />
    <filter type="and">
      <condition attribute="dfe_customerjourney" operator="eq" uitype="dfe_customerjourneyconfig" value="{{customerJourneyId}}" />
      <condition attribute="statecode" operator="eq" value="0" />
    </filter>
  </entity>
 </fetch>
{% endfetchxml %}
{% assign portalPageconfig_result = portalPageconfig_query.results.entities %}
