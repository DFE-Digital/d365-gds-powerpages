{% fetchxml customerjourneyconfig_query %}
   <fetch >
    <entity name="dfe_customerjourneyconfig">
    <attribute name="dfe_customerjourneyconfigid" />
    <attribute name="dfe_name" />
    <attribute name="dfe_webpage" />
    <attribute name="dfe_type" />
    <attribute name="dfe_next" />
    <order attribute="dfe_name" descending="false" />
    <filter type="and">
      <condition attribute="dfe_type" operator="eq" value="{{dfeType}}" />
      <condition attribute="statecode" operator="eq" value="0" />
    </filter>
  </entity>
 </fetch>
{% endfetchxml %}
{% assign customerjourneyconfig_result = customerjourneyconfig_query.results.entities %}
