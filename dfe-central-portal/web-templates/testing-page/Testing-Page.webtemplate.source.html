<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search and Select Example</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #results {
            border: 1px solid #ccc;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 5px;
            display: none;
        }
        .result-item {
            padding: 8px;
            cursor: pointer;
        }
        .result-item:hover {
            background-color: #f0f0f0;
        }
        table {
            margin-top: 20px;
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        .remove-item {
            cursor: pointer;
            color: red;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Search and Select Example</h1>
    <input type="text" id="searchInput" placeholder="Search..." />
    
    <div id="results"></div>
    <table id="selectedItemsTable">
        <thead>
            <tr>
                <th>Selected Items</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <script> 
    
        $(document).ready(function() {
           {% include 'DfE/Analytics/CustomEvent/LandingPage' %}
            $('#searchInput').on('keyup', function() {
                const query = $(this).val().toLowerCase();
                debugger;
                if (query.length >= 3) {
                   // const filteredItems = items.filter(item => item.toLowerCase().includes(query));
				   var cacheValue = Date.now();
				   var _url = "/getactivecontacts/?firstname=" + query + "&cachestring=" + cacheValue;
				   $.ajax({
						  method: "GET",
						  contentType: "application/json",
						  url:_url
						})
						.done(function(data) 
						{
						  if(data && data.results && data.results.length > 0)
						  {
						   debugger;
							 $('#results').empty().show();
							data.results.forEach(item => 
							{
								$('#results').append(`<div class='result-item'>${item.fullName}</div>`);
							});
							 {% include 'DfE/Analytics/CustomEvent/Table' tableName:"Account",operationType:"Update" %}                             
                             
							}
							else {
								$('#results').hide();
							}
						})
						.fail(function () {
						  
						});
				}
            });
            $(document).on('click', '.result-item', function() {
                const itemText = $(this).text();
                // Check if the item already exists in the table
                const rowExists = $(`#selectedItemsTable tbody tr:contains(${itemText})`).length > 0;
                if (!rowExists) {
                    $('#selectedItemsTable tbody').append(`
                        <tr>
                            <td>${itemText}</td>
                            <td><span class="remove-item">X</span></td>
                        </tr>
                    `);
                }
                // Clear the search input and hide results
                $('#searchInput').val('');
                $('#results').hide();
            });
            $(document).on('click', '.remove-item', function() {
                $(this).closest('tr').remove();
            });
        });
    </script>
</body>
</html>
