<!-- 
  USE THIS CONTENT WHEN THE SERVICE ONLY USES ESSENTIAL COOKIES
-->
<div class="govuk-cookie-banner" data-nosnippet role="region" aria-label="Cookies on {{ settings['DfE/ServiceName'] }}">
  <div class="govuk-cookie-banner__message dfe-width-container">
    <div class="dfe-grid-row">
      <div class="dfe-grid-column-two-thirds">
        <h2 class="govuk-cookie-banner__heading govuk-heading-m">
          Cookies on {{ settings['DfE/ServiceName'] }}
        </h2>
        <div class="govuk-cookie-banner__content">
          <p class="govuk-body">We use some essential cookies to make this service work.</p>
        </div>
      </div>
    </div>
    <div class="govuk-button-group">
      <button type="button" class="govuk-button" data-module="govuk-button">
        OK
      </button>
      <a class="govuk-link" href="#">View cookies</a>
    </div>
  </div>
</div>
